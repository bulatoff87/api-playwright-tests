name: Petstore tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Check out pinned original server source
        uses: actions/checkout@v6
        with:
          repository: swagger-api/swagger-petstore
          ref: d57941e8fe959e508796b27469b1e8bba73392dc
          path: .upstream
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: unit/pom.xml
      - name: Run isolated server unit tests
        run: mvn --batch-mode --no-transfer-progress -f unit/pom.xml test
      - name: Upload unit test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: unit-results
          path: unit/target/surefire-reports/
          retention-days: 30

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [smoke, regression]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check types
        run: npm run typecheck
      - name: Run API tests
        run: npm run test:${{ matrix.suite }}
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: api-${{ matrix.suite }}-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30
